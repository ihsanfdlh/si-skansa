<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1e1b4b" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Outer Ring with Golden Border -->
  <circle cx="100" cy="100" r="92" fill="#0f172a" />
  <circle cx="100" cy="100" r="88" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="4" filter="url(#shadow)" />

  <!-- Inner Decorative Circle -->
  <circle cx="100" cy="100" r="76" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.7" />

  <!-- Torch / Flame (Pendidikan) -->
  <path d="M100 35 C95 48 91 55 93 64 C95 72 100 76 100 76 C100 76 105 72 107 64 C109 55 105 48 100 35 Z" fill="url(#goldGrad)" />
  <path d="M100 45 C98 52 96 57 98 62 C100 66 100 66 100 66 C100 66 102 66 102 62 C104 57 102 52 100 45 Z" fill="#ffffff" opacity="0.8" />

  <!-- Gear (Kejuruan / Teknik) behind Book -->
  <g fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.85">
    <circle cx="100" cy="104" r="28" stroke-dasharray="7 5" stroke-width="5" />
    <circle cx="100" cy="104" r="16" stroke-width="2" />
  </g>

  <!-- Open Book (Ilmu Pengetahuan) -->
  <g filter="url(#shadow)">
    <!-- Book Left Page -->
    <path d="M100 112 C88 100 65 102 52 106 C50 107 48 109 48 112 L48 136 C62 131 84 130 100 142 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <!-- Book Right Page -->
    <path d="M100 112 C112 100 135 102 148 106 C150 107 152 109 152 112 L152 136 C138 131 116 130 100 142 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <!-- Book Spine -->
    <path d="M100 112 L100 142" stroke="#94a3b8" stroke-width="2" />
    <!-- Page Lines Left -->
    <path d="M58 116 C68 113 82 114 92 120 M58 123 C68 120 82 121 92 127" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    <!-- Page Lines Right -->
    <path d="M142 116 C132 113 118 114 108 120 M142 123 C132 120 118 121 108 127" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Three Golden Stars (Prestasi, Integritas, Karakter) -->
  <g fill="url(#goldGrad)">
    <!-- Center Star -->
    <polygon points="100,78 102,84 108,84 103,88 105,94 100,90 95,94 97,88 92,84 98,84" />
    <!-- Left Star -->
    <polygon points="76,84 77.5,88.5 82,88.5 78.5,91.5 80,96 76,93 72,96 73.5,91.5 70,88.5 74.5,88.5" />
    <!-- Right Star -->
    <polygon points="124,84 125.5,88.5 130,88.5 126.5,91.5 128,96 124,93 120,96 121.5,91.5 118,88.5 122.5,88.5" />
  </g>

  <!-- Ribbon at Bottom -->
  <g filter="url(#shadow)">
    <path d="M38 156 L55 146 L55 166 Z" fill="#b45309" />
    <path d="M162 156 L145 146 L145 166 Z" fill="#b45309" />
    <path d="M48 152 Q100 142 152 152 L146 168 Q100 158 54 168 Z" fill="url(#goldGrad)" stroke="#d97706" stroke-width="1" />
    <text x="100" y="163" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="12" fill="#78350f" letter-spacing="2.5">SKANSA</text>
  </g>

  <!-- Top Text Curving/Straight -->
  <text x="100" y="30" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="9" fill="#e0f2fe" letter-spacing="3">SMK NEGERI 1</text>
</svg>
